<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PISTACHIO PLUS · 开心果行李箱系列 | ITO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

        :root {
            --ito-black: #111111;
            --ito-green: #2D8B6F;
            --ito-green-light: #DCFCE7;
            --ito-gray-100: #FAFAFA;
            --ito-gray-200: #F5F5F5;
            --ito-gray-300: #E5E7EB;
            --ito-gray-500: #666666;
            --ito-gray-700: #999999;
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--ito-gray-100);
            color: var(--ito-black);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(180deg, #FFFFFF 0%, #FAFAFA 100%);
            border-bottom: 1px solid var(--ito-gray-300);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background-color: rgba(255,255,255,0.92);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 32px 0;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            color: var(--ito-black);
        }

        .brand-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--ito-gray-500);
            margin-top: 4px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* Tab 切换 */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-top: 20px;
            position: relative;
        }

        .tab-btn {
            padding: 12px 40px;
            font-size: 15px;
            font-weight: 500;
            color: var(--ito-gray-500);
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
            transition: var(--transition-smooth);
            letter-spacing: 1px;
        }

        .tab-btn:hover { color: var(--ito-black); }

        .tab-btn.active {
            color: var(--ito-black);
            font-weight: 600;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 3px;
            background: var(--ito-green);
            border-radius: 2px;
        }

        .tab-divider {
            width: 1px;
            height: 20px;
            background: var(--ito-gray-300);
            align-self: center;
            margin: 0 8px;
        }

        /* ===== Main Layout ===== */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            min-height: calc(100vh - 200px);
        }

        /* 左侧导航 */
        .nav-sidebar {
            width: 280px;
            min-width: 280px;
            background: #FFFFFF;
            border-right: 1px solid var(--ito-gray-300);
            padding: 32px 0;
            height: calc(100vh - 180px);
            overflow-y: auto;
            position: sticky;
            top: 140px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--ito-gray-700);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0 24px 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            cursor: pointer;
            transition: var(--transition-smooth);
            border-left: 3px solid transparent;
            color: var(--ito-gray-500);
            font-size: 14.5px;
            font-weight: 400;
        }

        .nav-item:hover {
            background: var(--ito-gray-100);
            color: var(--ito-black);
        }

        .nav-item.active {
            background: var(--ito-green-light);
            border-left-color: var(--ito-green);
            color: var(--ito-black);
            font-weight: 500;
        }

        .nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--ito-gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition-smooth);
            color: var(--ito-gray-500);
        }

        .nav-icon svg {
            width: 18px;
            height: 18px;
            stroke-width: 1.8;
            transition: var(--transition-smooth);
        }

        .nav-item.active .nav-icon {
            background: var(--ito-green);
        }

        .nav-item.active .nav-icon svg {
            stroke: #FFFFFF;
        }

        .nav-number {
            font-size: 11px;
            color: var(--ito-gray-700);
            font-weight: 600;
            min-width: 20px;
        }

        /* 右侧内容区 */
        .content-area {
            flex: 1;
            padding: 40px 48px;
            overflow-y: auto;
        }

        /* 图片展示 */
        .image-stage {
            width: 100%;
            aspect-ratio: 16/10;
            border-radius: 16px;
            overflow: hidden;
            background: var(--ito-gray-200);
            box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
            position: relative;
            margin-bottom: 36px;
        }

        /* 双图并排布局 */
        .image-stage.dual-image {
            display: flex;
            gap: 0;
            aspect-ratio: auto;
            min-height: 400px;
        }

        .dual-image-item {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-right: 2px solid #fff;
        }

        .dual-image-item:last-child {
            border-right: none;
        }

        .dual-image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .dual-label {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 14px;
            background: rgba(17,17,17,0.75);
            color: #fff;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            pointer-events: none;
            z-index: 2;
        }

        .image-stage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: var(--ito-gray-700);
            gap: 12px;
        }

        .image-placeholder svg {
            width: 56px;
            height: 56px;
            opacity: 0.3;
        }

        .image-placeholder span {
            font-size: 13px;
            opacity: 0.6;
        }

        /* 信息卡片 */
        .info-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 36px 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            animation: fadeSlideUp 0.5s ease both;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .module-header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 20px;
        }

        .module-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: var(--ito-green-light);
            color: var(--ito-green);
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .module-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--ito-black);
            letter-spacing: 1px;
        }

        .module-desc {
            font-size: 15.5px;
            line-height: 1.85;
            color: var(--ito-gray-500);
            margin-bottom: 28px;
        }

        .design-intent {
            background: linear-gradient(135deg, var(--ito-gray-100) 0%, #f0fdf4 100%);
            border-radius: 12px;
            padding: 20px 24px;
            border-left: 4px solid var(--ito-green);
            position: relative;
            overflow: hidden;
        }

        .design-intent::before {
            content: '"';
            position: absolute;
            top: -8px;
            left: 12px;
            font-size: 64px;
            color: var(--ito-green);
            opacity: 0.08;
            font-family: Georgia, serif;
            line-height: 1;
        }

        .design-intent-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--ito-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .design-intent-text {
            font-size: 14px;
            line-height: 1.75;
            color: var(--ito-gray-500);
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        /* 特性标签 */
        .feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px;
        }

        .feature-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #FFFFFF;
            border: 1px solid var(--ito-gray-300);
            border-radius: 20px;
            font-size: 12.5px;
            color: var(--ito-gray-500);
            transition: var(--transition-smooth);
        }

        .feature-tag:hover {
            border-color: var(--ito-green);
            color: var(--ito-green);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 32px;
            color: var(--ito-gray-700);
            font-size: 13px;
            border-top: 1px solid var(--ito-gray-300);
            background: #FFFFFF;
        }

        .footer-brand {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 6px;
            color: var(--ito-black);
            margin-bottom: 4px;
        }

        /* Fade 动画 */
        .fade-enter { animation: fadeIn 0.45s ease both; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 导航项入场动画 */
        .nav-item { animation: navItemIn 0.35s ease both; }
        @keyframes navItemIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--ito-gray-300); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ito-gray-500); }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .nav-sidebar {
                width: 100%;
                min-width: unset;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--ito-gray-300);
                padding: 20px 0;
            }
            .nav-sidebar .nav-list {
                display: flex;
                overflow-x: auto;
                gap: 4px;
                padding: 0 16px;
            }
            .nav-item {
                white-space: nowrap;
                border-left: none;
                border-bottom: 3px solid transparent;
                padding: 10px 18px;
                border-radius: 8px;
                background: var(--ito-gray-100);
            }
            .nav-item.active {
                border-left: none;
                border-bottom-color: var(--ito-green);
                background: var(--ito-green-light);
            }
            .nav-icon { display: none; }
            .nav-section-title { display: none; }
            .content-area { padding: 24px 20px; }
            .info-card { padding: 24px; }
            .module-title { font-size: 22px; }
            .header-inner { padding: 20px 16px 0; }
            .brand-title { font-size: 24px; letter-spacing: 2px; }
        }

        /* 图片加载状态 */
        .img-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ito-gray-200);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--ito-gray-300);
            border-top-color: var(--ito-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 规格表格 */
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 14px;
        }

        .spec-table th {
            text-align: left;
            padding: 10px 16px;
            background: var(--ito-gray-100);
            color: var(--ito-gray-500);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--ito-gray-300);
        }

        .spec-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--ito-gray-300);
            color: var(--ito-gray-500);
        }

        .spec-table tr:last-child td { border-bottom: none; }
        .spec-table tr:hover td { background: var(--ito-gray-100); }

        /* 进度指示器 */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: var(--ito-green);
            z-index: 1000;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* 键盘导航提示 */
        .kbd-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(17,17,17,0.85);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 200;
        }

        .kbd-hint.show {
            opacity: 1;
            transform: translateY(0);
        }

        .kbd-key {
            display: inline-block;
            padding: 2px 7px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            margin: 0 2px;
        }
    </style>
</head>
<body>

<!-- 进度条 -->
<div class="progress-bar" id="progressBar"></div>

<!-- Header -->
<header class="header">
    <div class="header-inner">
        <h1 class="brand-title">ITO PISTACHIO PLUS</h1>
        <p class="brand-subtitle">开心果系列行李箱</p>

        <!-- 尺寸Tab -->
        <div class="tab-container">
            <button class="tab-btn active" data-size="20" onclick="switchSize('20')">
                20寸 登机箱
            </button>
            <div class="tab-divider"></div>
            <button class="tab-btn" data-size="26" onclick="switchSize('26')">

            </button>
        </div>
    </div>
</header>

<!-- 主内容 -->
<main class="main-container">

    <!-- 左侧导航 -->
    <aside class="nav-sidebar" id="navSidebar">
        <div class="nav-section-title">功能模块</div>
        <nav class="nav-list" id="navList"><!-- JS动态渲染 --></nav>
    </aside>

    <!-- 右侧内容 -->
    <section class="content-area" id="contentArea">
        <div class="image-stage" id="imageStage">
            <!-- JS动态渲染 -->
        </div>
        <div class="info-card" id="infoCard">
            <!-- JS动态渲染 -->
        </div>
    </section>

</main>

<!-- Footer -->
<footer class="footer">
    <div class="footer-brand">ITO</div>
    <p>Designed for Travelers · 轻熟致享 · 家庭出行</p>
</footer>

<!-- 键盘提示 -->
<div class="kbd-hint" id="kbdHint">
    按 <span class="kbd-key">↑</span> <span class="kbd-key">↓</span> 切换模块 &nbsp; <span class="kbd-key">Esc</span> 关闭
</div>

// ============================================================
// 状态管理
// ============================================================
let currentSize = "20";
let currentModuleId = "pp20-structure";

// ============================================================
// 渲染函数
// ============================================================

function renderNav() {
    const data = PRODUCT_DATA[currentSize];
    const navList = document.getElementById("navList");
    
    let html = "";
    data.modules.forEach((mod, idx) => {
        const isActive = mod.id === currentModuleId;
        html += `
            <div class="nav-item ${isActive ? 'active' : ''}" 
                 data-id="${mod.id}"
                 onclick="switchModule('${mod.id}')"
                 style="animation-delay:${idx * 0.05}s">
                <div class="nav-icon" data-lucide="${mod.icon}"></div>
                <div>
                    <div class="nav-number">${mod.number}</div>
                    <div>${mod.title}</div>
                </div>
            </div>
        `;
    });
    
    navList.innerHTML = html;
    
    // 渲染 Lucide Icons
    if (typeof lucide !== 'undefined' && lucide.createIcons) {
        lucide.createIcons();
    }
}

function renderContent() {
    const data = PRODUCT_DATA[currentSize];
    const mod = data.modules.find(m => m.id === currentModuleId) || data.modules[0];
    const imageStage = document.getElementById("imageStage");
    const infoCard = document.getElementById("infoCard");
    
    // 渲染图片区域
    if (mod.images && mod.images.length > 0) {
        // 双图并排模式
        imageStage.className = "image-stage dual-image";
        let imgsHtml = mod.images.map((img, i) => `
            <div class="dual-image-item">
                <div class="img-loading img-loading-${i}">
                    <div class="spinner"></div>
                </div>
                <img src="${img.src}" alt="${img.label}"
                     onload="this.previousElementSibling.style.display='none'"
                     onerror="this.style.display='none'; this.parentElement.querySelector('.img-loading-${i}').innerHTML='<div style=display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;color:#999;><svg width=40 height=40 viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'1.5\' opacity=\'0.3\'><rect x=\'3\' y=\'3\' width=\'18\' height=\'18\' rx=\'2\'/><circle cx=\'8.5\' cy=\'8.5\' r=\'1.5\'/><path d=\'M21 15l-5-5L5 21\'/></svg><span>${img.label}</span></div>'">
                <span class="dual-label">${img.label}</span>
            </div>
        `).join('');
        imageStage.innerHTML = imgsHtml;
    } else if (mod.image) {
        // 单图模式
        imageStage.className = "image-stage";
        imageStage.innerHTML = `
            <div class="img-loading" id="imgLoading">
                <div class="spinner"></div>
            </div>
            <img src="${mod.image}" 
                 alt="${mod.title}" 
                 onload="document.getElementById('imgLoading').style.display='none'"
                 onerror="this.style.display='none'; document.getElementById('imgLoading').innerHTML='<div class=image-placeholder><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/><path d=\"M21 15l-5-5L5 21\"/></svg><span>${mod.placeholder}</span></div>'">
        `;
    } else {
        imageStage.className = "image-stage";
        imageStage.innerHTML = `
            <div class="image-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <span style="font-weight:600;font-size:14px;color:#999;">${mod.placeholder}</span>
                <span style="font-size:12px;">（等待替换为产品实拍图）</span>
            </div>
        `;
    }
    
    // 渲染信息卡片
    infoCard.innerHTML = `
        <div class="module-header fade-enter">
            <span class="module-badge">${data.sizeLabel} · ${mod.number}</span>
            <h2 class="module-title">${mod.title}</h2>
        </div>
        
        <p class="module-desc fade-enter" style="animation-delay:0.1s">${mod.desc}</p>
        
        <div class="design-intent fade-enter" style="animation-delay:0.2s">
            <div class="design-intent-label">✦ 设计意图</div>
            <div class="design-intent-text">${mod.designIntent}</div>
        </div>
        
        <div class="feature-tags fade-enter" style="animation-delay:0.3s">
            ${mod.tags.map(tag => `<span class="feature-tag">✦ ${tag}</span>`).join("")}
        </div>
    `;

    // 更新进度条
    updateProgress();
}

function updateProgress() {
    const data = PRODUCT_DATA[currentSize];
    const idx = data.modules.findIndex(m => m.id === currentModuleId);
    const pct = ((idx + 1) / data.modules.length) * 100;
    document.getElementById("progressBar").style.width = pct + "%";
}

// ============================================================
// 事件处理
// ============================================================

function switchSize(size) {
    if (size === currentSize) return;
    currentSize = size;
    
    // 更新Tab样式
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.size === size);
    });
    
    // 切换到该尺寸的第一个模块
    currentModuleId = PRODUCT_DATA[size].modules[0].id;
    
    renderNav();
    renderContent();
}

function switchModule(moduleId) {
    if (moduleId === currentModuleId) return;
    currentModuleId = moduleId;
    
    // 更新导航高亮
    document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.toggle("active", item.dataset.id === moduleId);
    });
    
    renderContent();
}

// 键盘导航
document.addEventListener("keydown", (e) => {
    const hint = document.getElementById("kbdHint");
    const data = PRODUCT_DATA[currentSize];
    const idx = data.modules.findIndex(m => m.id === currentModuleId);
    
    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
        e.preventDefault();
        if (idx < data.modules.length - 1) {
            switchModule(data.modules[idx + 1].id);
            hint.classList.add("show");
            setTimeout(() => hint.classList.remove("show"), 1500);
        }
    } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        e.preventDefault();
        if (idx > 0) {
            switchModule(data.modules[idx - 1].id);
            hint.classList.add("show");
            setTimeout(() => hint.classList.remove("show"), 1500);
        }
    } else if (e.key === "Escape") {
        hint.classList.remove("show");
    }
});

// ============================================================
// 初始化
// ============================================================
renderNav();
renderContent();

// 图片预加载
function preloadImages() {
    Object.values(PRODUCT_DATA).forEach(sizeData => {
        sizeData.modules.forEach(mod => {
            if (mod.image) {
                const img = new Image();
                img.src = mod.image;
            }
        });
    });
}
preloadImages();
