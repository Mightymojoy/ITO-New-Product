<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITO 新品系列</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ito-black: #1A1A1A;
            --ito-white: #FAFAFA;
            --ito-green: #2D8B6F;
            --ito-green-light: #E8F5F0;
            --ito-gray-100: #F5F5F5;
            --ito-gray-200: #EEEEEE;
            --ito-gray-300: #DDDDDD;
            --ito-gray-400: #999999;
            --ito-gray-500: #666666;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--ito-white);
            color: var(--ito-black);
            min-height: 100vh;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 60px 24px 40px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: var(--ito-green);
        }

        .brand-name {
            font-size: 13px;
            letter-spacing: 6px;
            color: var(--ito-green);
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .page-title {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--ito-black);
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--ito-gray-500);
            letter-spacing: 1px;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        /* Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        /* Product Card */
        .product-card {
            background: #FFFFFF;
            border: 1px solid var(--ito-gray-200);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: block;
        }

        .product-card:hover {
            border-color: var(--ito-green);
            box-shadow: 0 12px 40px rgba(45, 139, 111, 0.08);
            transform: translateY(-4px);
        }

        .product-card:hover .card-image img {
            transform: scale(1.03);
        }

        .card-image {
            position: relative;
            width: 100%;
            padding-top: 100%;
            background: var(--ito-gray-100);
            overflow: hidden;
        }

        .card-image img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Placeholder for products without image */
        .card-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--ito-gray-100) 0%, var(--ito-gray-200) 100%);
        }

        .card-placeholder svg {
            width: 48px;
            height: 48px;
            stroke: var(--ito-gray-300);
        }

        .card-info {
            padding: 20px 24px 24px;
        }

        .card-badge {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--ito-green);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .card-name-en {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--ito-black);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .card-name-cn {
            font-size: 13px;
            color: var(--ito-gray-400);
            letter-spacing: 1px;
        }

        .card-price {
            margin-top: 12px;
            font-size: 18px;
            font-weight: 600;
            color: var(--ito-black);
        }

        .card-price .yen {
            font-size: 13px;
            font-weight: 400;
            color: var(--ito-gray-400);
            margin-right: 2px;
        }

        .card-hint {
            margin-top: 6px;
            font-size: 12px;
            color: var(--ito-gray-400);
        }

        /* Size guide badge */
        .size-guide {
            display: inline-flex;
            gap: 4px;
            margin-top: 8px;
        }

        .size-chip {
            padding: 2px 10px;
            border: 1px solid var(--ito-gray-300);
            border-radius: 12px;
            font-size: 11px;
            color: var(--ito-gray-500);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid var(--ito-gray-200);
            color: var(--ito-gray-400);
            font-size: 12px;
            letter-spacing: 2px;
        }

        .footer-brand {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 4px;
            color: var(--ito-black);
            margin-bottom: 4px;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 540px) {
            .header { padding: 40px 20px 32px; }
            .page-title { font-size: 26px; }
            .container { padding: 32px 16px 60px; }
            .product-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .card-info { padding: 16px 20px 20px; }
            .card-name-en { font-size: 15px; }
        }

        /* Page entrance animation */
        .product-card {
            opacity: 0;
            transform: translateY(24px);
            animation: cardIn 0.6s ease forwards;
        }

        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.2s; }
        .product-card:nth-child(3) { animation-delay: 0.3s; }
        .product-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="brand-name">ITO</div>
    <h1 class="page-title">新品系列展示</h1>
    <p class="page-subtitle">TRUFFLE PRO · PISTACHIO PLUS · WEEKENDER</p>
</header>

<!-- Product Grid -->
<main class="container">
    <div class="product-grid">

        <!-- 1. PISTACHIO PLUS -->
        <a class="product-card" href="../PISTACHIO-PLUS%20开心果系列.html" target="_blank">
            <div class="card-image">
                <img src="PISTACHIO%20PLUS.jpg" alt="PISTACHIO PLUS" loading="lazy">
            </div>
            <div class="card-info">
                <div class="card-badge">行李箱</div>
                <div class="card-name-en">PISTACHIO PLUS</div>
                <div class="card-name-cn">开心果系列行李箱</div>
                <div class="card-price"><span class="yen">¥</span>1,690 <span class="yen">起</span></div>
                <div class="size-guide">
                    <span class="size-chip">20"</span>
                    <span class="size-chip">25"</span>
                    <span class="size-chip">29"</span>
                </div>
            </div>
        </a>

        <!-- 2. TRUFFLE PRO TOTE -->
        <a class="product-card" href="../TRUFFLE-PRO%20TOTE.html" target="_blank">
            <div class="card-image">
                <img src="TRUFFLE%20PRO%20TOTE.jpg" alt="TRUFFLE PRO TOTE" loading="lazy">
            </div>
            <div class="card-info">
                <div class="card-badge">托特包</div>
                <div class="card-name-en">TRUFFLE PRO TOTE</div>
                <div class="card-name-cn">松露系列托特包</div>
                <div class="card-price"><span class="yen">¥</span>1,290</div>
                <div class="card-hint">烟黑 · 雾灰 · 棕褐</div>
            </div>
        </a>

        <!-- 3. TRUFFLE PRO BACKPACK -->
        <a class="product-card" href="../TRUFFLE-PRO%20BACKPACK.html" target="_blank">
            <div class="card-image">
                <img src="TRUFFLE%20PRO%20BACKPACK.jpg" alt="TRUFFLE PRO BACKPACK" loading="lazy">
            </div>
            <div class="card-info">
                <div class="card-badge">双肩包</div>
                <div class="card-name-en">TRUFFLE PRO BACKPACK</div>
                <div class="card-name-cn">松露系列双肩包</div>
                <div class="card-price"><span class="yen">¥</span>1,190 <span class="yen">起</span></div>
                <div class="size-guide">
                    <span class="size-chip">12L</span>
                    <span class="size-chip">20L</span>
                </div>
                <div class="card-hint">烟黑 · 雾灰 · 棕褐</div>
            </div>
        </a>

        <!-- 4. WEEKENDER -->
        <a class="product-card" href="../WEEKENDER.html" target="_blank">
            <div class="card-image">
                <img src="weekender.jpg" alt="WEEKENDER" loading="lazy">
            </div>
            <div class="card-info">
                <div class="card-badge">旅行袋</div>
                <div class="card-name-en">WEEKENDER</div>
                <div class="card-name-cn">旅行袋</div>
                <div class="card-price"><span class="yen">¥</span>1,590</div>
                <div class="size-guide">
                    <span class="size-chip">36L</span>
                </div>
                <div class="card-hint">屿灰 · 瑾紫 · 羽白</div>
            </div>
        </a>

    </div>
</main>

<!-- Footer -->
<footer class="footer">
    <div class="footer-brand">ITO</div>
    Designed for Travelers · 轻熟致享 · 家庭出行
</footer>

<script>
    lucide.createIcons();
</script>

</body>
</html>
