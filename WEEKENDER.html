            color: var(--ito-black);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .header {
            background: linear-gradient(180deg, #FFFFFF 0%, #FAFAFA 100%);
            border-bottom: 1px solid var(--ito-gray-300);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background-color: rgba(255,255,255,0.92);
        }
        
        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 32px 0;
        }
        
        .brand-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            color: var(--ito-black);
        }
        
        .brand-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--ito-gray-500);
            margin-top: 4px;
            letter-spacing: 2px;
            font-weight: 300;
        }
        
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            min-height: calc(100vh - 200px);
        }
        
        .nav-sidebar {
            width: 280px;
            min-width: 280px;
            background: #FFFFFF;
            border-right: 1px solid var(--ito-gray-300);
            padding: 32px 0;
            height: calc(100vh - 180px);
            overflow-y: auto;
            position: sticky;
            top: 140px;
        }
        
        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--ito-gray-700);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0 24px 16px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            cursor: pointer;
            transition: var(--transition-smooth);
            border-left: 3px solid transparent;
            color: var(--ito-gray-500);
            font-size: 14.5px;
            font-weight: 400;
        }
        
        .nav-item:hover { background: var(--ito-gray-100); color: var(--ito-black); }
        .nav-item.active { background: var(--ito-green-light); border-left-color: var(--ito-green); color: var(--ito-black); font-weight: 500; }
        
        .nav-icon {
            width: 36px; height: 36px; border-radius: 10px; background: var(--ito-gray-200);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: var(--transition-smooth); color: var(--ito-gray-500);
        }
        .nav-icon svg { width: 18px; height: 18px; stroke-width: 1.8; transition: var(--transition-smooth); }
        .nav-item.active .nav-icon { background: var(--ito-green); }
        .nav-item.active .nav-icon svg { stroke: #FFFFFF; }
        .nav-number { font-size: 11px; color: var(--ito-gray-700); font-weight: 600; min-width: 20px; }
        
        .content-area { flex: 1; padding: 40px 48px; overflow-y: auto; }
        
        .image-stage {
            width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden;
            background: var(--ito-gray-200); box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            position: relative; margin-bottom: 36px;
        }
        .image-stage img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease; }
        
        .image-placeholder {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            color: var(--ito-gray-700); background: var(--ito-gray-200);
        }
        .image-placeholder svg { width: 48px; height: 48px; opacity: 0.3; }
        
        .info-card {
            background: #FFFFFF; border-radius: 16px; padding: 36px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.05); border: 1px solid var(--ito-gray-300);
        }
        .module-header { margin-bottom: 24px; }
        
        .module-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; background: var(--ito-green-light); color: var(--ito-green);
            font-size: 12px; font-weight: 600; border-radius: 20px; letter-spacing: 0.5px;
        }
        
        .module-title { font-size: 26px; font-weight: 700; color: var(--ito-black); letter-spacing: 1px; margin-top: 8px; }
        .module-desc { font-size: 15.5px; line-height: 1.85; color: var(--ito-gray-500); margin-bottom: 28px; }
        
        .design-intent {
            background: linear-gradient(135deg, var(--ito-gray-100) 0%, #f0fdf4 100%);
            border-radius: 12px; padding: 20px 24px; border-left: 4px solid var(--ito-green);
            position: relative; overflow: hidden;
        }
        .design-intent::before { content: '"'; position: absolute; top: -8px; left: 12px; font-size: 64px; color: var(--ito-green); opacity: 0.08; font-family: Georgia, serif; line-height: 1; }
        .design-intent-label { font-size: 11px; font-weight: 600; color: var(--ito-green); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .design-intent-text { font-size: 14px; line-height: 1.75; color: var(--ito-gray-500); font-style: italic; position: relative; z-index: 1; }

        .feature-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: #FFFFFF; border: 1px solid var(--ito-gray-300); border-radius: 20px; font-size: 12.5px; color: var(--ito-gray-500); transition: var(--transition-smooth); }

        .price-badge {
            display: inline-flex; align-items: center; gap: 4px; margin-top: 8px;
            padding: 5px 16px; background: var(--ito-green); color: #FFFFFF;
            font-size: 20px; font-weight: 700; letter-spacing: 1px; border-radius: 6px;

            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; margin-bottom: 6px;
        }
        .material-badge {
            display: inline-flex; align-items: center; padding: 4px 12px;

            font-size: 11.5px; font-weight: 500; color: var(--ito-green);
            background: transparent; letter-spacing: 0.3px;
        }
        
        .spec-table { width: 100%; border-collapse: collapse; margin-top: 32px; font-size: 14px; }
        .spec-table th { text-align: left; padding: 10px 16px; background: var(--ito-gray-100); color: var(--ito-gray-500); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--ito-gray-300); }
        .spec-table td { padding: 12px 16px; border-bottom: 1px solid var(--ito-gray-300); color: var(--ito-gray-500); }
        .spec-table tr:last-child td { border-bottom: none; }
        .spec-table tr:hover td { background: var(--ito-gray-100); }
        
        .footer { text-align: center; padding: 32px; color: var(--ito-gray-700); font-size: 13px; border-top: 1px solid var(--ito-gray-300); background: #FFFFFF; }
        .footer-brand { font-weight: 700; font-size: 18px; letter-spacing: 6px; color: var(--ito-black); margin-bottom: 4px; }
        
        .fade-enter { animation: fadeIn 0.45s ease both; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-item { animation: navItemIn 0.35s ease both; }
        @keyframes navItemIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--ito-gray-300); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ito-gray-500); }
        
        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .nav-sidebar { width: 100%; min-width: unset; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--ito-gray-300); padding: 20px 0; }
            .nav-sidebar .nav-list { display: flex; overflow-x: auto; gap: 4px; padding: 0 16px; }
            .nav-item { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; padding: 10px 18px; border-radius: 8px; background: var(--ito-gray-100); }
            .nav-item.active { border-left: none; border-bottom-color: var(--ito-green); background: var(--ito-green-light); }
            .nav-icon { display: none; }
            .nav-section-title { display: none; }
            .content-area { padding: 24px 20px; }
            .info-card { padding: 24px; }
            .module-title { font-size: 22px; }
            .header-inner { padding: 20px 16px 0; }
            .brand-title { font-size: 24px; letter-spacing: 2px; }
        }
        
        .img-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--ito-gray-200); }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--ito-gray-300); border-top-color: var(--ito-green); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .kbd-hint { position: fixed; bottom: 20px; right: 20px; background: rgba(17,17,17,0.85); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12px; backdrop-filter: blur(8px); opacity: 0; transform: translateY(8px); transition: all 0.3s ease; pointer-events: none; z-index: 200; }
        .kbd-hint.show { opacity: 1; transform: translateY(0); }
        .kbd-key { display: inline-block; padding: 2px 7px; background: rgba(255,255,255,0.15); border-radius: 4px; font-family: monospace; font-size: 11px; margin: 0 2px; }
    </style>
</head>

        ["净重", "1.05kg"],
        ["电脑兼容", "最高16英寸笔记本电脑"],
        ["主仓设计", "大U框开口 + 拉链隔离层"],
        ["五金拉链", "自锁拉链（所有五金）"],
        ["特殊设计", "鞋仓隔离 / 前置办公仓 / 可拆卸收纳包"],
        ["肩带", "可调节可拆卸肩带"],
        ["适配", "拉杆箱插袋系统"]
    ]
};

// ============================================================
// 状态管理 & 渲染
// ============================================================
let currentModuleId = PRODUCT_DATA.modules[0].id;

function renderNav() {
    const navList = document.getElementById("navList");
    let html = "";
    PRODUCT_DATA.modules.forEach((mod, idx) => {
        const isActive = mod.id === currentModuleId;
        html += `
            <div class="nav-item ${isActive ? 'active' : ''}" 
                 data-id="${mod.id}"
                 onclick="switchModule('${mod.id}')"
                 style="animation-delay:${idx * 0.05}s">
                <div class="nav-icon" data-lucide="${mod.icon}"></div>
                <div>
                    <div class="nav-number">${mod.number}</div>
                    <div>${mod.title}</div>
                </div>
            </div>
        `;
    });
    navList.innerHTML = html;
    if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
}

function renderContent() {
    const mod = PRODUCT_DATA.modules.find(m => m.id === currentModuleId) || PRODUCT_DATA.modules[0];
    const imageStage = document.getElementById("imageStage");
    const infoCard = document.getElementById("infoCard");
    
    imageStage.className = "image-stage";
    if (mod.image) {
        imageStage.innerHTML = `
            <div class="img-loading" id="imgLoading"><div class="spinner"></div></div>
            <img src="${mod.image}" alt="${mod.title}"
                 onload="document.getElementById('imgLoading').style.display='none'"
                 onerror="this.style.display='none'">
        `;
    } else {
        imageStage.innerHTML = `
            <div class="image-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <span style="font-weight:600;font-size:14px;color:#999;">${mod.placeholder}</span>
                <span style="font-size:12px;">（等待替换为产品实拍图）</span>
            </div>
        `;
    }
    
    infoCard.innerHTML = `
        <div class="module-header fade-enter">
            <span class="module-badge">WEEKENDER · ${mod.number}</span>
            <h2 class="module-title">${mod.title}</h2>
            <div class="price-badge">
                <span class="yen">¥</span>${PRODUCT_DATA.price.replace(/^¥/, '')}
            </div>
            <div class="material-badges fade-enter" style="animation-delay:0.02s">
                ${PRODUCT_DATA.materials.map(m => `<span class="material-badge">${m}</span>`).join("")}
            </div>
        </div>
        <p class="module-desc fade-enter" style="animation-delay:0.1s">${mod.desc}</p>
        <div class="design-intent fade-enter" style="animation-delay:0.2s">
            <div class="design-intent-label">✦ 设计意图</div>
            <div class="design-intent-text">${mod.designIntent}</div>
        </div>
        <div class="feature-tags fade-enter" style="animation-delay:0.3s">
            ${mod.tags.map(t => `<span class="feature-tag">✦ ${t}</span>`).join("")}
        </div>
        <table class="spec-table fade-enter" style="animation-delay:0.35s">
            <tr><th colspan="2">规格参数</th></tr>
            ${PRODUCT_DATA.specs.map(s => `<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join("")}
        </table>
    `;
    updateProgress();
}

function updateProgress() {
    const idx = PRODUCT_DATA.modules.findIndex(m => m.id === currentModuleId);
    document.getElementById("progressBar").style.width = ((idx + 1) / PRODUCT_DATA.modules.length) * 100 + "%";
}

function switchModule(moduleId) {
    if (moduleId === currentModuleId) return;
    currentModuleId = moduleId;
    document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.toggle("active", item.dataset.id === moduleId);
    });
    renderContent();
}

document.addEventListener("keydown", (e) => {
    const hint = document.getElementById("kbdHint");
    const idx = PRODUCT_DATA.modules.findIndex(m => m.id === currentModuleId);
    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
        e.preventDefault();
        if (idx < PRODUCT_DATA.modules.length - 1) {
            switchModule(PRODUCT_DATA.modules[idx + 1].id);
            hint.classList.add("show"); setTimeout(() => hint.classList.remove("show"), 1500);
        }
    } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        e.preventDefault();
        if (idx > 0) {
            switchModule(PRODUCT_DATA.modules[idx - 1].id);
            hint.classList.add("show"); setTimeout(() => hint.classList.remove("show"), 1500);
        }
    } else if (e.key === "Escape") hint.classList.remove("show");
});

renderNav();
renderContent();
</script>
</body>
</html>
